<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .icon {
    width: 448px; height: 448px; border-radius: 112px;
    background: linear-gradient(135deg, #7b98ff 0%, #5b7cfa 45%, #4a63e8 100%);
    display: grid; place-items: center;
    box-shadow: 0 24px 60px rgba(74, 99, 232, .38), inset 0 0 0 2px rgba(255, 255, 255, .22);
  }
  svg { width: 250px; height: 250px; }
</style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
  </div>
</body>
</html>
